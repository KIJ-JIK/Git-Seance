name: Keep Render Service Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping (sleeps at 15m)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          URL="https://git-seance.onrender.com"
          echo "Pinging $URL to prevent cold start..."
          curl -s -f -m 15 "$URL" > /dev/null || true
